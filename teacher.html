<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Guru - Edit Soal Game Pembelajaran</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .subject-section { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h3 { color: #3498db; text-transform: uppercase; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 14px; }
        button { background: #2ecc71; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; display: block; width: 100%; margin-top: 20px; }
        button:hover { background: #27ae60; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel Kontrol Guru (Edit Soal)</h1>
        <p>Edit daftar pertanyaan, pilihan ganda, kunci jawaban, dan koin hadiah dalam format JSON di bawah ini:</p>
        
        <div class="subject-section">
            <h3>Format Data Soal (JSON)</h3>
            <textarea id="json-input"></textarea>
        </div>

        <button onclick="saveQuestions()">Simpan Perubahan Soal</button>
        <p id="status"></p>
    </div>

    <script>
        fetch('/api/questions')
            .then(res => res.json())
            .then(data => {
                document.getElementById('json-input').value = JSON.stringify(data, null, 4);
            });

        function saveQuestions() {
            try {
                const parsedData = JSON.parse(document.getElementById('json-input').value);
                fetch('/api/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(parsedData)
                })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status.style.color'] = '#27ae60';
                    document.getElementById('status').innerText = data.message;
                });
            } catch (e) {
                document.getElementById('status').style.color = '#e74c3c';
                document.getElementById('status').innerText = "Format JSON salah! Periksa kembali tanda kurung dan tanda kutip.";
            }
        }
    </script>
</body>
</html>
