<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Pembelajaran 3D - Kota Petualangan</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            touch-action: none; 
        }

        /* Modal Input Nama */
        #name-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .name-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .name-box h2 { margin-top: 0; color: #333; }
        .name-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .name-box input:focus { border-color: #4CAF50; }
        .name-box button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Info Overlay & Fullscreen Button */
        #info {
            position: absolute;
            top: 15px; left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 10;
        }

        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #fullscreen-btn:active {
            background: rgba(76, 175, 80, 0.8);
        }

        /* Modal Kuis */
        #quiz-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            text-align: center;
            width: 90%;
            max-width: 400px;
            z-index: 20;
            border: 3px solid #FFD700;
        }
        #quiz-question { font-size: 18px; margin-bottom: 20px; color: #2c3e50; }
        .quiz-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        /* D-Pad Layar Sentuh */
        #touch-controls {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 140px;
            height: 140px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #333;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div id="name-modal">
        <div class="name-box">
            <h2>Kota Edukasi 3D</h2>
            <p>Masukkan nama karaktermu:</p>
            <input type="text" id="player-name-input" placeholder="Nama..." maxlength="12" />
            <button onclick="startGame()">Mulai Bermain</button>
        </div>
    </div>

    <div id="info">
        <b>Kontrol:</b> WASD / Panah untuk Jalan<br>
        <b>Kamera:</b> Drag Layar/Mouse untuk Rotasi 360°
    </div>

    <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

    <div id="quiz-modal">
        <h3 id="quiz-question">Pertanyaan Kuis?</h3>
        <button class="quiz-btn" onclick="checkAnswer('A')">A. Pilihan A</button>
        <button class="quiz-btn" onclick="checkAnswer('B')">B. Pilihan B</button>
        <button class="quiz-btn" onclick="checkAnswer('C')">C. Pilihan C</button>
        <p id="quiz-feedback"></p>
    </div>

    <div id="touch-controls">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-right">►</div>
        <div class="touch-btn" id="btn-down">▼</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        // -------------------------------------------------------------
        // FULLSCREEN LOGIC
        // -------------------------------------------------------------
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // -------------------------------------------------------------
        // 1. SCENE & CAMERA SETUP
        // -------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(40, 60, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        const d = 50;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // -------------------------------------------------------------
        // 2. KOTA (ENVIRONMENT)
        // -------------------------------------------------------------
        const cityGroup = new THREE.Group();

        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a3a3a });
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        cityGroup.add(ground);

        function createCityGrid() {
            const blockSize = 30;
            const roadWidth = 10;
            const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });

            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    const bx = x * (blockSize + roadWidth);
                    const bz = z * (blockSize + roadWidth);

                    const sidewalkGeo = new THREE.BoxGeometry(blockSize, 0.2, blockSize);
                    const sidewalk = new THREE.Mesh(sidewalkGeo, sidewalkMat);
                    sidewalk.position.set(bx, 0.1, bz);
                    sidewalk.receiveShadow = true;
                    cityGroup.add(sidewalk);

                    createBuildingCluster(bx, bz, blockSize);
                }
            }
        }

        function createBuildingCluster(cx, cz, size) {
            const colors = [0xe74c3c, 0x3498db, 0x9b59b6, 0xf1c40f, 0x1abc9c, 0x34495e, 0xecf0f1];
            const buildingGeo = new THREE.BoxGeometry(1, 1, 1);

            const offsets = [
                { x: -size/4, z: -size/4 },
                { x: size/4, z: -size/4 },
                { x: -size/4, z: size/4 },
                { x: size/4, z: size/4 }
            ];

            offsets.forEach(off => {
                const h = 8 + Math.random() * 25;
                const w = size / 2.4;
                const d = size / 2.4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const mat = new THREE.MeshLambertMaterial({ color: color });
                const b = new THREE.Mesh(buildingGeo, mat);
                b.scale.set(w, h, d);
                b.position.set(cx + off.x, h / 2 + 0.2, cz + off.z);
                b.castShadow = true;
                b.receiveShadow = true;
                cityGroup.add(b);

                const windowMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
                const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, h * 0.8, d + 0.1), windowMat);
                windowMesh.position.set(cx + off.x, h / 2 + 0.2, cz + off.z);
                windowMesh.scale.set(0.98, 0.9, 0.98);
                cityGroup.add(windowMesh);
            });
        }

        createCityGrid();
        scene.add(cityGroup);

        // Checkpoint Kuis
        const checkpoint = new THREE.Mesh(
            new THREE.CylinderGeometry(3, 3, 0.4, 16),
            new THREE.MeshLambertMaterial({ color: 0xFFD700 })
        );
        checkpoint.position.set(0, 0.2, -15);
        scene.add(checkpoint);

        // -------------------------------------------------------------
        // 3. KARAKTER ROBLOX NOOB
        // -------------------------------------------------------------
        function createRobloxCharacter() {
            const characterGroup = new THREE.Group();

            const headMat = new THREE.MeshLambertMaterial({ color: 0xf5cd2f });
            const torsoMat = new THREE.MeshLambertMaterial({ color: 0xf5cd2f });
            const armMat = new THREE.MeshLambertMaterial({ color: 0xf5cd2f });
            const legMat = new THREE.MeshLambertMaterial({ color: 0x0000ff });

            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.6), torsoMat);
            torso.position.y = 1.4;
            torso.castShadow = true;
            characterGroup.add(torso);

            // Stiker "R"
            const canvasR = document.createElement('canvas');
            canvasR.width = 128; canvasR.height = 128;
            const ctxR = canvasR.getContext('2d');
            ctxR.fillStyle = '#f5cd2f'; ctxR.fillRect(0,0,128,128);
            ctxR.font = 'Bold 80px Arial'; ctxR.fillStyle = '#e74c3c';
            ctxR.fillText('R', 35, 90);
            const rTexture = new THREE.CanvasTexture(canvasR);
            const rLogo = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: rTexture }));
            rLogo.position.set(0.25, 1.5, 0.31);
            characterGroup.add(rLogo);

            // Kepala & Wajah
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), headMat);
            head.position.y = 2.4;
            head.castShadow = true;
            characterGroup.add(head);

            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 128; faceCanvas.height = 128;
            const fCtx = faceCanvas.getContext('2d');
            fCtx.fillStyle = '#f5cd2f'; fCtx.fillRect(0,0,128,128);
            fCtx.fillStyle = '#000000';
            fCtx.fillRect(30, 35, 15, 25);
            fCtx.fillRect(83, 35, 15, 25);
            fCtx.beginPath();
            fCtx.arc(64, 70, 30, 0, Math.PI, false);
            fCtx.lineWidth = 8; fCtx.stroke();
            const faceTexture = new THREE.CanvasTexture(faceCanvas);
            const face = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.75), new THREE.MeshBasicMaterial({ map: faceTexture }));
            face.position.set(0, 2.4, 0.41);
            characterGroup.add(face);

            // Lengan Kiri & Kanan
            const armGeo = new THREE.BoxGeometry(0.5, 1.2, 0.5);
            
            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.88, 1.9, 0);
            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.y = -0.5; leftArm.castShadow = true;
            leftArmPivot.add(leftArm);
            characterGroup.add(leftArmPivot);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.88, 1.9, 0);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.y = -0.5; rightArm.castShadow = true;
            rightArmPivot.add(rightArm);
            characterGroup.add(rightArmPivot);

            // Kaki Kiri & Kanan
            const legGeo = new THREE.BoxGeometry(0.55, 1.2, 0.55);

            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.32, 0.8, 0);
            const leftLeg = new THREE.Mesh(legGeo, legMat);
            leftLeg.position.y = -0.6; leftLeg.castShadow = true;
            leftLegPivot.add(leftLeg);
            characterGroup.add(leftLegPivot);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.32, 0.8, 0);
            const rightLeg = new THREE.Mesh(legGeo, legMat);
            rightLeg.position.y = -0.6; rightLeg.castShadow = true;
            rightLegPivot.add(rightLeg);
            characterGroup.add(rightLegPivot);

            return {
                mesh: characterGroup,
                leftArmPivot: leftArmPivot, rightArmPivot: rightArmPivot,
                leftLegPivot: leftLegPivot, rightLegPivot: rightLegPivot,
                walkTime: 0
            };
        }

        function createNameSprite(nameText) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.roundRect(10, 10, 236, 44, 10);
            ctx.fill();
            ctx.font = 'Bold 22px Arial'; ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(nameText, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(3, 0.75, 1);
            sprite.position.y = 3.1;
            return sprite;
        }

        // -------------------------------------------------------------
        // 4. MULTIPLAYER SETUP
        // -------------------------------------------------------------
        const otherPlayers = {};
        let localPlayerObj = null;
        let myName = "";

        function startGame() {
            const input = document.getElementById('player-name-input');
            myName = input.value.trim() || `Siswa ${Math.floor(Math.random() * 899 + 100)}`;
            document.getElementById('name-modal').style.display = 'none';
            socket.emit('joinGame', myName);

            // Coba pemicu Fullscreen saat tombol game diklik
            toggleFullscreen();
        }

        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach((id) => {
                if (id === socket.id) {
                    localPlayerObj = createRobloxCharacter();
                    localPlayerObj.mesh.position.set(players[id].x, players[id].y, players[id].z);
                    const tag = createNameSprite(players[id].name);
                    localPlayerObj.mesh.add(tag);
                    scene.add(localPlayerObj.mesh);
                } else {
                    addOtherPlayer(players[id]);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => { addOtherPlayer(playerInfo); });

        function addOtherPlayer(playerInfo) {
            const pObj = createRobloxCharacter();
            pObj.mesh.position.set(playerInfo.x, playerInfo.y, playerInfo.z);
            const tag = createNameSprite(playerInfo.name);
            pObj.mesh.add(tag);
            scene.add(pObj.mesh);
            otherPlayers[playerInfo.id] = pObj;
        }

        socket.on('playerMoved', (data) => {
            if (otherPlayers[data.id]) {
                const p = otherPlayers[data.id];
                p.mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
                p.mesh.rotation.y = data.pos.ry;
                animateWalk(p, data.pos.isMoving);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id].mesh);
                delete otherPlayers[id];
            }
        });

        // -------------------------------------------------------------
        // 5. KAMERA 360 DERAJAT & KONTROL INPUT
        // -------------------------------------------------------------
        let cameraYaw = 0;      
        let cameraPitch = 0.35; 
        const cameraDistance = 8;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Mouse Rotation
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#touch-controls') || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            cameraYaw -= deltaX * 0.005;
            cameraPitch += deltaY * 0.005;
            cameraPitch = Math.max(0.05, Math.min(Math.PI / 2.2, cameraPitch));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Touch Rotation (Diperbarui agar tidak bentrok dengan D-Pad di HP)
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#touch-controls') || e.target.closest('#fullscreen-btn') || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            cameraYaw -= deltaX * 0.006;
            cameraPitch += deltaY * 0.006;
            cameraPitch = Math.max(0.05, Math.min(Math.PI / 2.2, cameraPitch));

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Input Keyboard & Touch D-Pad
        const keys = { Up: false, Down: false, Left: false, Right: false };
        let canMove = true;

        window.addEventListener('keydown', (e) => {
            if (!canMove) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
        });

        function bindTouch(elementId, direction) {
            const btn = document.getElementById(elementId);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (canMove) keys[direction] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[direction] = false; });
        }
        bindTouch('btn-up', 'Up');
        bindTouch('btn-down', 'Down');
        bindTouch('btn-left', 'Left');
        bindTouch('btn-right', 'Right');

        function animateWalk(playerObj, isMoving) {
            if (isMoving) {
                playerObj.walkTime += 0.15;
                const angle = Math.sin(playerObj.walkTime) * 0.6;
                playerObj.leftLegPivot.rotation.x = angle;
                playerObj.rightLegPivot.rotation.x = -angle;
                playerObj.leftArmPivot.rotation.x = -angle;
                playerObj.rightArmPivot.rotation.x = angle;
            } else {
                playerObj.walkTime = 0;
                playerObj.leftLegPivot.rotation.x = 0;
                playerObj.rightLegPivot.rotation.x = 0;
                playerObj.leftArmPivot.rotation.x = 0;
                playerObj.rightArmPivot.rotation.x = 0;
            }
        }

        // -------------------------------------------------------------
        // 6. MAIN LOOP & GERAKAN SEARAH KAMERA
        // -------------------------------------------------------------
        const speed = 0.14;
        let quizActive = false;
        let checkpointPassed = false;

        function animate() {
            requestAnimationFrame(animate);

            if (canMove && localPlayerObj) {
                let inputX = 0;
                let inputZ = 0;

                if (keys.Up) inputZ -= 1;
                if (keys.Down) inputZ += 1;
                if (keys.Left) inputX -= 1;
                if (keys.Right) inputX += 1;

                const isMoving = (inputX !== 0 || inputZ !== 0);

                if (isMoving) {
                    // Normalisasi input
                    const len = Math.sqrt(inputX * inputX + inputZ * inputZ);
                    inputX /= len;
                    inputZ /= len;

                    // Dapatkan arah horizontal Kamera (Kamera Forward & Right)
                    const forward = new THREE.Vector3();
                    camera.getWorldDirection(forward);
                    forward.y = 0; 
                    forward.normalize();

                    const right = new THREE.Vector3();
                    right.crossVectors(forward, new THREE.Vector3(0, 1, 0)); // Dibalik agar tidak terbalik

                    // Hitung Arah Gerak Dunia berdasarkan Input
                    const moveDirection = new THREE.Vector3();
                    moveDirection.addScaledVector(forward, -inputZ); // Tombol Depan/Belakang
                    moveDirection.addScaledVector(right, inputX);    // Tombol Kanan/Kiri
                    moveDirection.normalize();

                    // Terapkan Pergerakan
                    localPlayerObj.mesh.position.x += moveDirection.x * speed;
                    localPlayerObj.mesh.position.z += moveDirection.z * speed;

                    // Putar Karakter Menghadap Arah Berjalan
                    const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                    localPlayerObj.mesh.rotation.y = targetAngle;

                    socket.emit('playerMovement', {
                        x: localPlayerObj.mesh.position.x,
                        y: localPlayerObj.mesh.position.y,
                        z: localPlayerObj.mesh.position.z,
                        ry: localPlayerObj.mesh.rotation.y,
                        isMoving: true
                    });
                } else {
                    socket.emit('playerMovement', {
                        x: localPlayerObj.mesh.position.x,
                        y: localPlayerObj.mesh.position.y,
                        z: localPlayerObj.mesh.position.z,
                        ry: localPlayerObj.mesh.rotation.y,
                        isMoving: false
                    });
                }

                animateWalk(localPlayerObj, isMoving);

                // Update Posisi Kamera Mengikuti Karakter
                const targetPos = localPlayerObj.mesh.position;
                camera.position.x = targetPos.x + cameraDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
                camera.position.y = targetPos.y + cameraDistance * Math.sin(cameraPitch) + 1.5;
                camera.position.z = targetPos.z + cameraDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
                camera.lookAt(targetPos.x, targetPos.y + 1.5, targetPos.z);
            }

            // Check Kuis Checkpoint
            if (localPlayerObj && !quizActive && !checkpointPassed &&
                Math.abs(localPlayerObj.mesh.position.x - checkpoint.position.x) < 3 &&
                Math.abs(localPlayerObj.mesh.position.z - checkpoint.position.z) < 3) {
                triggerQuiz();
            }

            renderer.render(scene, camera);
        }
        animate();

        // -------------------------------------------------------------
        // 7. MODAL KUIS LOGIC & RESIZE
        // -------------------------------------------------------------
        function triggerQuiz() {
            quizActive = true;
            canMove = false;
            document.getElementById('quiz-modal').style.display = 'block';
            document.getElementById('quiz-question').innerText = "Berapakah hasil dari 5 + 5 x 2 ?";
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons[0].innerText = "A. 20";
            buttons[1].innerText = "B. 15";
            buttons[2].innerText = "C. 10";
        }

        function checkAnswer(option) {
            const feedback = document.getElementById('quiz-feedback');
            if (option === 'B') {
                feedback.style.color = "#2ecc71";
                feedback.innerText = "Benar sekali! Kamu hebat! 🎉";
                setTimeout(() => {
                    document.getElementById('quiz-modal').style.display = 'none';
                    checkpointPassed = true;
                    scene.remove(checkpoint);
                    feedback.innerText = "";
                    quizActive = false;
                    canMove = true;
                }, 1200);
            } else {
                feedback.style.color = "#e74c3c";
                feedback.innerText = "Coba lagi ya!";
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
